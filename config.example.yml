# jobwatch — config example. Copy to config.yml and fill.
interval: 15m
state_path: state.json

queries:
  - source: hh
    text: "Golang"
    area_id: 1          # Moscow
    remote_only: false
  - source: hh
    text: "Go разработчик"
    area_id: 113        # Russia
    remote_only: true
  - source: hirify
    text: "golang"
    hirify_pages: 2     # hirify live-search API, anonymous

gate:
  bin: lm
  question: >
    Подходит ли вакансия под профиль кандидата: senior Go backend (5 лет),
    Москва или удалёнка, не агентство и не аутстафф, не 1С и не Java,
    зарплата от 400к gross?

agent:
  work_dir: ~/Projects/career/jobseeker
  resume_hint: ~/Projects/career/jobseeker/resume-2026.md

hirify:
  key: ""            # or env HIRIFY_AGENT_KEY — hirify.me/account/api-access
  profile_id: null   # optional: profile from POST /api/agent/profiles
  apply_enabled: false  # true = the TG button really applies (agent:apply key)

telegram:
  token: ""      # or env JOBWATCH_TG_TOKEN
  chat_id: 0

max_analyze_per_cycle: 3
max_cards_per_day: 10
